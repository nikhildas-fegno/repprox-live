services:
  postgres:
    image: postgres:16-alpine
    container_name: repprox_postgres
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5460:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: repprox_app
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      target: builder
    profiles: ["admin"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
