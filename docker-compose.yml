services:
  postgres:
    image: postgres:16-alpine
    container_name: repprox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repprox
      POSTGRES_USER: repprox
      POSTGRES_PASSWORD: repprox_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repprox -d repprox"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: repprox_app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://repprox:repprox_secret@postgres:5432/repprox
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      target: builder
    profiles: ["admin"]
    environment:
      DATABASE_URL: postgresql://repprox:repprox_secret@postgres:5432/repprox
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
